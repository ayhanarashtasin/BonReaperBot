[project]
name = "bone-reaper"
version = "0.1.0"
description = "Read-only / paper research platform for short-duration binary crypto prediction markets. Not a validated profitable strategy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "polymarket-client==0.17.0",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "pyarrow>=16",
    "httpx>=0.27,<1",
    "websockets>=12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
bone-reaper = "bone_reaper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=4",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "psycopg[binary]>=3.1,<4",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bone_reaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: touches a real public endpoint; opt in with --run-network",
    "metered: may transmit real orders; never collected by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "*.md",
    ".agent", ".claude", ".codebuddy", ".codex", ".continue", ".cursor", ".gemini",
    ".github", ".kiro", ".opencode", ".qoder", ".roo", ".trae", ".windsurf",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "psycopg", "psycopg.*", "pgserver"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["bone_reaper"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
